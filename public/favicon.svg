<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Cyber Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="letterAGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Letter R & Surge Gradient -->
    <linearGradient id="surgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="75%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.2" />

  <!-- Inner Ambient Neon Glow -->
  <circle cx="96" cy="34" r="24" fill="#06B6D4" opacity="0.18" />
  <circle cx="34" cy="94" r="26" fill="#2563EB" opacity="0.16" />

  <!-- Monogram Mark: Dynamic Interlocking A + R with Marketing Surge Arrow -->
  <!-- Left Leg of A -->
  <path
    d="M 28 92 L 48 36 C 49 33 52 33 53 36 L 68 76"
    stroke="url(#letterAGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crossbar of A linking to R -->
  <path
    d="M 37 68 L 62 68"
    stroke="url(#letterAGrad)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- R Stem (Shared Right Apex) & R Loop -->
  <path
    d="M 68 36 L 68 92"
    stroke="#F8FAFC"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <path
    d="M 68 36 L 82 36 C 92 36 96 44 96 52 C 96 60 91 66 80 66 L 68 66"
    stroke="url(#surgeGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- R Dynamic Growth Arrow Leg (Surges to Top Right 45°) -->
  <path
    d="M 76 66 L 98 40"
    stroke="url(#surgeGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <!-- Arrow Head -->
  <path
    d="M 86 38 L 102 36 L 100 52"
    stroke="#00E5FF"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing Cyan Growth Spark at Peak -->
  <circle cx="102" cy="36" r="3.5" fill="#00E5FF" filter="url(#emeraldGlow)" />
  <circle cx="102" cy="36" r="1.8" fill="#FFFFFF" />

  <!-- Mini Marketing Growth Trend Dot (Bottom Left) -->
  <circle cx="28" cy="92" r="3.2" fill="#06B6D4" />
</svg>
