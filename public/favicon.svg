<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0C38" />
      <stop offset="50%" stop-color="#120726" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="letterAGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>

    <!-- Letter R & Surge Gradient -->
    <linearGradient id="surgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Inner Ambient Neon Glow -->
  <circle cx="94" cy="34" r="24" fill="#10B981" opacity="0.18" />
  <circle cx="34" cy="94" r="28" fill="#A855F7" opacity="0.15" />

  <!-- Monogram Mark: Dynamic Interlocking A + R with Marketing Surge Arrow -->
  <!-- Left Leg of A -->
  <path
    d="M 28 92 L 48 36 C 49 33 52 33 53 36 L 68 76"
    stroke="url(#letterAGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crossbar of A linking to R -->
  <path
    d="M 37 68 L 62 68"
    stroke="url(#letterAGrad)"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- R Stem (Shared Right Apex) & R Loop -->
  <path
    d="M 68 36 L 68 92"
    stroke="#EDE9FE"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <path
    d="M 68 36 L 82 36 C 92 36 96 44 96 52 C 96 60 91 66 80 66 L 68 66"
    stroke="url(#surgeGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- R Dynamic Growth Arrow Leg (Surges to Top Right 45°) -->
  <path
    d="M 76 66 L 98 40"
    stroke="url(#surgeGrad)"
    stroke-width="8.5"
    stroke-linecap="round"
  />
  <!-- Arrow Head -->
  <path
    d="M 86 38 L 102 36 L 100 52"
    stroke="#34D399"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing Emerald Growth Spark at Peak -->
  <circle cx="102" cy="36" r="3.5" fill="#34D399" filter="url(#emeraldGlow)" />
  <circle cx="102" cy="36" r="1.8" fill="#FFFFFF" />

  <!-- Mini Marketing Growth Trend Dot (Bottom Left) -->
  <circle cx="28" cy="92" r="3" fill="#A855F7" />
</svg>
